spring.config.import=optional:file:./local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gameshelf}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

igdb.client-id=${IGDB_CLIENT_ID}
igdb.access-token=${IGDB_ACCESS_TOKEN}

# GG.deals price aggregation (optional — omit or leave blank to disable store offers)
# Get a free key at https://gg.deals/affiliate/
ggdeals.api-key=${GGDEALS_API_KEY:}

server.port=8080

# File upload
# Local directory where uploads are stored (swap to S3 config later)
upload.dir=./uploads
# Base URL used to build public file URLs (override in production)
upload.base-url=http://localhost:8080
# Multipart size limits (validated again in service layer for clearer errors)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB