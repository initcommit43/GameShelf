# Active profile: defaults to "dev" locally; set SPRING_PROFILES_ACTIVE=prod in production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gameshelf}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

igdb.client-id=${IGDB_CLIENT_ID}
igdb.access-token=${IGDB_ACCESS_TOKEN}

# GG.deals price aggregation (optional — omit or leave blank to disable store offers)
# Get a free key at https://gg.deals/affiliate/
ggdeals.api-key=${GGDEALS_API_KEY:}

server.port=8080

# File upload (swap upload.dir to S3 config for production)
upload.dir=./uploads
upload.base-url=${UPLOAD_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
