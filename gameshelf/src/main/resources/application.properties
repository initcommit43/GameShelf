spring.datasource.url=jdbc:postgresql://localhost:5432/gameshelf
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.mvc.cors.allowed-origins=http://localhost:5173

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

igdb.client-id=${IGDB_CLIENT_ID}
igdb.access-token=${IGDB_ACCESS_TOKEN}

server.port=8080

# File upload
# Local directory where uploads are stored (swap to S3 config later)
upload.dir=./uploads
# Base URL used to build public file URLs (override in production)
upload.base-url=http://localhost:8080
# Multipart size limits (validated again in service layer for clearer errors)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB