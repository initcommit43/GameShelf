# Active profile: defaults to "dev" locally; set SPRING_PROFILES_ACTIVE=prod in production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gameshelf}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=2592000000

igdb.client-id=${IGDB_CLIENT_ID}
igdb.client-secret=${IGDB_CLIENT_SECRET}

# CheapShark supplies the per-store price comparison. No API key needed, but it rejects
# requests with a missing or generic User-Agent, so this must identify the app.
cheapshark.user-agent=${CHEAPSHARK_USER_AGENT:GameShelf/1.0 (+https://github.com/initcommit43/GameShelf)}

# GG.deals market summary (optional — omit or leave blank to disable the summary rows).
# Generate a key in your GG.deals account settings: https://gg.deals/settings/
# Free tier is personal/hobby use and requires crediting GG.deals with a live link.
ggdeals.api-key=${GGDEALS_API_KEY:}

server.port=8080

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
